name: Build Roohu ClipForge Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Download offline speech models
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -fL --retry 3 -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q en.zip && mv vosk-model-small-en-us-0.15 model-en && rm en.zip
          curl -fL --retry 3 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip && mv vosk-model-small-hi-0.22 model-hi && rm hi.zip
      - name: Run JavaScript tests
        run: |
          node shared/test/validate.test.js
          node shared/test/projects.test.js
          node shared/test/subtitles.test.js
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Roohu-ClipForge-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
