name: Build Roohu ClipForge Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Download offline speech models
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -fL --retry 3 -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q en.zip && mv vosk-model-small-en-us-0.15 model-en && rm en.zip
          curl -fL --retry 3 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip && mv vosk-model-small-hi-0.22 model-hi && rm hi.zip
      - name: Run JavaScript tests
        run: |
          node shared/test/validate.test.js
          node shared/test/projects.test.js
          node shared/test/subtitles.test.js
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Roohu-ClipForge-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
